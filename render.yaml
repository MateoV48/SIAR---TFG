# Archivo de configuración para Render.com
# Este archivo permite definir múltiples servicios en un solo lugar

services:
  # Servicio Web (aplicación Flask)
  - type: web
    name: asistencia-tfg
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn "run:app"
    envVars:
      - key: SECRET_KEY
        sync: false  # Debes configurarlo manualmente en el dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: asistencia-tfg-db
          property: connectionString
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.11.0

  # Base de datos PostgreSQL
  - type: pg
    name: asistencia-tfg-db
    plan: free
    databaseName: tfg_db
    user: tfg_user







