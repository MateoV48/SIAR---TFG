{% extends "base.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="page-title">{{ titulo }}</div>

<div class="panel">
  <form method="POST">
    <div class="row g-3">
      <div class="col-md-6">
        <label for="nombre" class="form-label">Nombre *</label>
        <input type="text" class="form-control" id="nombre" name="nombre" 
               value="{{ usuario.nombre if usuario else '' }}" required>
      </div>
      <div class="col-md-6">
        <label for="apellido" class="form-label">Apellido *</label>
        <input type="text" class="form-control" id="apellido" name="apellido" 
               value="{{ usuario.apellido if usuario else '' }}" required>
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">Email *</label>
        <input type="email" class="form-control" id="email" name="email" 
               value="{{ usuario.email if usuario else '' }}" required>
      </div>
      <div class="col-md-6">
        <label for="rol" class="form-label">Rol *</label>
        <select class="form-select" id="rol" name="rol" required>
          {% for rol in roles %}
            <option value="{{ rol }}" {% if usuario and usuario.rol == rol %}selected{% endif %}>{{ rol }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label for="password" class="form-label">Contraseña {% if usuario %}(dejar vacío para no cambiar){% else %}*{% endif %}</label>
        <input type="password" class="form-control" id="password" name="password" 
               {% if not usuario %}required{% endif %}>
      </div>
      {% if usuario %}
      <div class="col-md-6">
        <div class="form-check mt-4">
          <input class="form-check-input" type="checkbox" id="activo" name="activo" 
                 {% if usuario.activo %}checked{% endif %}>
          <label class="form-check-label" for="activo">
            Usuario activo
          </label>
        </div>
      </div>
      {% endif %}
    </div>
    <div class="mt-4">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a href="{{ url_for('main.usuarios') }}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
