<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pantalla de Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body { background-color: #f5f7fb; }
      .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .login-card { width: 100%; max-width: 460px; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(9, 30, 66, 0.12); padding: 28px; }
      .form-title { font-weight: 700; font-size: 1.25rem; margin-bottom: 18px; color: #0f172a; }
      .app-title { font-weight: 800; font-size: 1.6rem; text-align: center; margin-bottom: 18px; color: #0f172a; }
      label { font-weight: 600; color: #334155; }
      .btn-primary { background-color: #2563eb; border-color: #2563eb; font-weight: 600; }
      .btn-primary:hover { background-color: #1d4ed8; border-color: #1d4ed8; }
    </style>
  </head>
  <body>
    <div class="login-wrapper">
      <div class="login-card">
        <div class="app-title">Pantalla de Login</div>
        <div class="form-title">Acceso al Sistema de Soporte a la Decisión</div>
        <form method="post" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Correo Electrónico:</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="usuario@colegio.edu.ar" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña:</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="*********" required />
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Ingresar</button>
          </div>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
  </html>
