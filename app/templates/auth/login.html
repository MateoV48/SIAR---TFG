<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pantalla de Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body { background-color: #f5f7fb; }
      .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .login-card { width: 100%; max-width: 460px; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(9, 30, 66, 0.12); padding: 28px; }
      .form-title { font-weight: 700; font-size: 1.25rem; margin-bottom: 18px; color: #0f172a; }
      .app-title { font-weight: 800; font-size: 1.6rem; text-align: center; margin-bottom: 18px; color: #0f172a; }
      .logo-container-login {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .logo-icon-login {
        width: 60px;
        height: 60px;
        flex-shrink: 0;
      }
      .logo-text-login {
        font-size: 2rem;
        font-weight: 700;
        color: #2563eb;
        letter-spacing: 2px;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
      }
      label { font-weight: 600; color: #334155; }
      .btn-primary { background-color: #2563eb; border-color: #2563eb; font-weight: 600; }
      .btn-primary:hover { background-color: #1d4ed8; border-color: #1d4ed8; }
    </style>
  </head>
  <body>
    <div class="login-wrapper">
      <div class="login-card">
        <div class="logo-container-login">
          <svg class="logo-icon-login" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Fondo circular -->
            <circle cx="50" cy="50" r="48" fill="#2563eb" opacity="0.1"/>
            <!-- Gráfico de barras representando análisis -->
            <rect x="25" y="60" width="12" height="25" fill="#2563eb" rx="2"/>
            <rect x="42" y="50" width="12" height="35" fill="#2563eb" rx="2"/>
            <rect x="59" y="40" width="12" height="45" fill="#2563eb" rx="2"/>
            <rect x="76" y="30" width="12" height="55" fill="#2563eb" rx="2"/>
            <!-- Icono de tendencia/analítica -->
            <path d="M 20 70 L 35 55 L 50 60 L 65 45 L 80 50" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="logo-text-login">SIAR</span>
        </div>
        <div class="form-title text-center">Acceso al Sistema</div>
        
        <!-- Mensajes Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        
        <form method="post" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Correo Electrónico:</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="usuario@colegio.edu.ar" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña:</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="*********" required />
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Ingresar</button>
          </div>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
  </html>
